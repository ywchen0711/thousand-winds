<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>千風群英譚 Saga of a Thousand Winds</title>
<meta name="description" content="原創的超任風格自由劇本 RPG：六位主角、八顆風之石、靈光一閃與生命點數。中英雙語。An original 16-bit free-scenario RPG in Chinese and English.">
<link rel="preload" href="fonts/Cubic_11.woff2" as="font" type="font/woff2" crossorigin>
<style>
  @font-face { font-family: Cubic11; src: url(fonts/Cubic_11.woff2) format('woff2'); font-display: block; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: Cubic11, sans-serif; color: #ccd; }
  #wrap { position: relative; line-height: 0; }
  #screen { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
  #touch { display: none; width: 100%; max-width: 560px; height: 180px; position: relative; flex: none; }
  body.touching #touch { display: block; }
  .dpad { position: absolute; left: 18px; bottom: 18px; width: 140px; height: 140px; }
  .dpad div { position: absolute; width: 46px; height: 46px; background: #2a2f48; border: 2px solid #4a5070; border-radius: 6px; }
  .dpad .u { left: 47px; top: 0; } .dpad .d { left: 47px; bottom: 0; } .dpad .l { left: 0; top: 47px; } .dpad .r { right: 0; top: 47px; } .dpad .c { left: 47px; top: 47px; border-radius: 0; background: #23273c; }
  .btn { position: absolute; width: 64px; height: 64px; border-radius: 50%; background: #8a2838; border: 3px solid #c84858; color: #fff; font: 22px Cubic11, sans-serif; display: flex; align-items: center; justify-content: center; line-height: 1; }
  .btn.a { right: 22px; bottom: 70px; }
  .btn.b { right: 100px; bottom: 26px; background: #283878; border-color: #4868c8; }
  .btn.m { right: 22px; bottom: 6px; width: 52px; height: 30px; border-radius: 15px; font-size: 14px; background: #3a3a48; border-color: #6a6a80; }
  #musicBtn { position: fixed; top: 8px; right: 8px; z-index: 20; width: 40px; height: 40px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.45); background: rgba(20,24,48,0.6); color: #fff; font: 20px sans-serif; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  #musicBtn.off { opacity: 0.6; }
  #musicBtn.off::after { content: ''; position: absolute; width: 30px; height: 3px; background: #ff6070; transform: rotate(-45deg); border-radius: 2px; }
</style>
</head>
<body>
<button id="musicBtn" type="button" aria-label="Music on/off" title="Music on/off (M)">♪</button>
<div id="wrap"><canvas id="screen" width="256" height="224"></canvas></div>
<div id="touch">
  <div class="dpad"><div class="u" data-k="up"></div><div class="l" data-k="left"></div><div class="c"></div><div class="r" data-k="right"></div><div class="d" data-k="down"></div></div>
  <div class="btn b" data-k="b">B</div>
  <div class="btn a" data-k="a">A</div>
  <div class="btn m" data-k="menu" id="menuBtn">選單</div>
</div>
<script>
  // Scale the 256x224 picture by a whole number of real screen pixels, so every game pixel is an
  // even square even with Windows display scaling at 125% or 150%. The canvas itself is that big.
  function fit() {
    const touch = document.body.classList.contains('touching');
    const dpr = window.devicePixelRatio || 1;
    const aw = innerWidth * dpr, ah = (innerHeight - (touch ? 180 : 0)) * dpr;
    const k = Math.max(1, Math.floor(Math.min(aw / 256, ah / 224)));
    const c = document.getElementById('screen');
    if (c.width !== 256 * k) { c.width = 256 * k; c.height = 224 * k; }
    c.style.width = (256 * k) / dpr + 'px'; c.style.height = (224 * k) / dpr + 'px';
  }
  addEventListener('resize', fit);
  new MutationObserver(fit).observe(document.body, { attributes: true, attributeFilter: ['class'] });
  fit();
</script>
<script type="module" src="js/main.js?v=2"></script>
</body>
</html>
